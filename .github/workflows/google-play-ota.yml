name: Google Play OTA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-play-ota.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Patch Samsung payment navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App.tsx')
          s = p.read_text()
          old = "]).start(({ finished }) => {\n      if (!finished) return;\n      LayoutAnimation.configureNext(LayoutAnimation.Presets.easeInEaseOut);\n      setEtapaConsulta(next);"
          new = "]).start(() => {\n      LayoutAnimation.configureNext(LayoutAnimation.Presets.easeInEaseOut);\n      setEtapaConsulta(next);"
          if old not in s:
              raise SystemExit('Expected navigation block not found; refusing unsafe patch')
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one navigation block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate patched app
        run: npm run typecheck
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Fix Android payment step navigation"
          git push origin HEAD:main
      - name: Publish production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --channel production --message "Fix Android Samsung payment navigation" --non-interactive

name: Google Play OTA

on:
  push:
    branches: [deploy/google-play-ota]
    paths:
      - '.github/workflows/google-play-ota.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate patched app
        run: npm run typecheck
      - name: Publish production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --channel production --message "Google Play Android polish" --non-interactive

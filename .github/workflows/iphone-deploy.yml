name: iPhone Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: O que deseja fazer?
        required: true
        type: choice
        options:
          - ota
          - ios_build
          - android_build
          - submit_testflight
          - finalize_release
        default: ota
      message:
        description: Mensagem da OTA
        required: false
        type: string
        default: Atualização do app
  push:
    branches: [main]
    paths:
      - '.deploy/request.json'

permissions:
  contents: write

concurrency:
  group: iphone-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e executar
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve deploy request
        id: request
        shell: bash
        env:
          MANUAL_ACTION: ${{ inputs.action }}
          MANUAL_MESSAGE: ${{ inputs.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="$MANUAL_ACTION"
            MESSAGE="$MANUAL_MESSAGE"
          else
            ACTION=$(node -e "const r=require('./.deploy/request.json'); process.stdout.write(String(r.action || 'none'))")
            MESSAGE=$(node -e "const r=require('./.deploy/request.json'); process.stdout.write(String(r.message || 'Atualização do app'))")
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"
          echo "Solicitação: $ACTION"

      - name: Ignore initialization request
        if: ${{ steps.request.outputs.action == 'none' }}
        run: echo "Nenhum deploy solicitado."

      - name: Install dependencies
        if: ${{ steps.request.outputs.action != 'none' }}
        run: npm ci

      - name: Align Expo dependencies for Android build
        if: ${{ steps.request.outputs.action == 'android_build' }}
        run: |
          npx expo install expo-asset
          npx expo install --fix
          npx expo-doctor

      - name: Apply final release patches
        if: ${{ steps.request.outputs.action == 'finalize_release' }}
        run: |
          node scripts/apply-final-navigation-polish.mjs
          node scripts/apply-private-doctor-ratings.mjs

      - name: Typecheck
        if: ${{ steps.request.outputs.action != 'none' }}
        run: npm run typecheck

      - name: Persist final release source changes
        if: ${{ steps.request.outputs.action == 'finalize_release' }}
        run: |
          if git diff --quiet; then
            echo "Patches já estavam aplicados."
          else
            git config user.name "consultaja24h-deploy"
            git config user.email "actions@users.noreply.github.com"
            git add App.tsx src/AppRoot.tsx src/components/ChatPaciente.tsx src/api/avaliacao.ts
            git commit -m "Apply final navigation polish and private ratings"
            git push origin HEAD:main
          fi

      - name: Verify Expo authentication
        if: ${{ steps.request.outputs.action != 'none' }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN não está configurado no repositório."
            exit 1
          fi
          npx eas-cli@latest whoami

      - name: Publish production OTA
        if: ${{ steps.request.outputs.action == 'ota' || steps.request.outputs.action == 'finalize_release' }}
        env:
          OTA_MESSAGE: ${{ steps.request.outputs.message }}
        run: npx eas-cli@latest update --channel production --message "$OTA_MESSAGE" --non-interactive

      - name: Start production iOS build
        if: ${{ steps.request.outputs.action == 'ios_build' }}
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --no-wait

      - name: Start production Android build
        if: ${{ steps.request.outputs.action == 'android_build' }}
        run: npx eas-cli@latest build --platform android --profile production --non-interactive --no-wait

      - name: Submit latest iOS build
        if: ${{ steps.request.outputs.action == 'submit_testflight' }}
        run: npx eas-cli@latest submit --platform ios --latest --profile production --non-interactive

      - name: Reject unknown request
        if: ${{ steps.request.outputs.action != 'none' && steps.request.outputs.action != 'ota' && steps.request.outputs.action != 'ios_build' && steps.request.outputs.action != 'android_build' && steps.request.outputs.action != 'submit_testflight' && steps.request.outputs.action != 'finalize_release' }}
        run: |
          echo "Ação desconhecida: ${{ steps.request.outputs.action }}"
          exit 1

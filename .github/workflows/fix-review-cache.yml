name: Fix review flow cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-review-cache.yml'

permissions:
  contents: write

jobs:
  patch-and-publish:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Patch stale consultation cache
        run: node scripts/fix-review-cache.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/client.ts
          git commit -m "Prevent stale consultation status cache" || exit 0
          git push
      - name: Publish OTA
        if: env.EXPO_TOKEN != ''
        run: npx eas-cli@latest update --channel production --message "Fix stale review consultation status" --non-interactive

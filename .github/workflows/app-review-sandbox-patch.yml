name: Apply App Review Sandbox Patch

on:
  push:
    paths:
      - '.github/workflows/app-review-sandbox-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fix keyboard and send key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('App.tsx')
          s = app.read_text()
          s = s.replace(
              "<KeyboardAvoidingView style={{ flex: 1 }} behavior={Platform.OS === 'ios' ? 'padding' : undefined}>",
              "<KeyboardAvoidingView style={{ flex: 1 }} behavior={Platform.OS === 'ios' ? 'padding' : 'height'} keyboardVerticalOffset={0}>",
              1,
          )
          pattern = r"(style=\{styles\.triageInput\}\s*)multiline\s*(editable=\{!triagemLoading && !!perguntaAtual\}\s*maxLength=\{700\})"
          repl = r'''\1multiline={false}
                \2
                returnKeyType="send"
                blurOnSubmit={false}
                onSubmitEditing={() => {
                  if (!triagemLoading && respostaTriagem.trim()) enviarRespostaTriagem();
                }}'''
          s, n = re.subn(pattern, repl, s, count=1)
          if n != 1:
              raise SystemExit('triage input patch not applied')
          app.write_text(s)

          chat = Path('src/components/ChatPaciente.tsx')
          s = chat.read_text()
          s = s.replace(
              "<KeyboardAvoidingView style={styles.screen} behavior={Platform.OS === 'ios' ? 'padding' : undefined}>",
              "<KeyboardAvoidingView style={styles.screen} behavior={Platform.OS === 'ios' ? 'padding' : 'height'} keyboardVerticalOffset={0}>",
              1,
          )
          pattern = r"(style=\{styles\.input\}\s*)multiline\s*(maxLength=\{3000\}\s*editable=\{!enviando\}\s*returnKeyType=\"send\")"
          repl = r'''\1multiline={false}
                \2
                blurOnSubmit={false}'''
          s, n = re.subn(pattern, repl, s, count=1)
          if n != 1:
              raise SystemExit('chat input patch not applied')
          chat.write_text(s)
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Commit patched app
        run: |
          if git diff --quiet -- App.tsx src/components/ChatPaciente.tsx; then
            echo "No keyboard changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/components/ChatPaciente.tsx
          git commit -m "Fix keyboard visibility and send key"
          git push

name: Apply App Review Sandbox Patch

on:
  push:
    paths:
      - '.github/workflows/app-review-sandbox-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply review sandbox patch
        run: node scripts/apply-app-review-sandbox.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/components/PagamentoConsulta.tsx
          git commit -m "Enable isolated App Review payment sandbox"
          git push

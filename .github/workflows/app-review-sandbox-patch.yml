name: Apply App Review Sandbox Patch

on:
  push:
    paths:
      - '.github/workflows/app-review-sandbox-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply project patches and typecheck
        run: npm run typecheck
      - name: Commit patched app
        run: |
          if git diff --quiet -- App.tsx src/components/PagamentoConsulta.tsx; then
            echo "No review sandbox changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/components/PagamentoConsulta.tsx
          git commit -m "Enable isolated App Review payment sandbox"
          git push

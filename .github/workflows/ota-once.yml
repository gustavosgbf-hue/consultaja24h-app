name: Guarded OTA publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ota-once.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply platform origin tracking
        run: node scripts/apply-platform-origin.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit platform tracking
        run: |
          if git diff --quiet -- src/api/client.ts; then
            echo "Platform tracking already present"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/api/client.ts
            git commit -m "Track Android and iOS consultation origin"
            git push origin HEAD:main
          fi

      - name: Verify Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository."
            exit 78
          fi

      - name: Publish OTA to production
        run: npx eas-cli@latest update --channel production --message "Track consultation origin: Android/iOS" --non-interactive
